[robot]
ur_host = "REPLACE_ME"
# Policy/record loop rate; the reused SpaceMouse/UR low-level loop remains 125 Hz.
control_hz = 10.0
observation_timeout_ms = 200
policy_timeout_ms = 1000
workspace_min_m = [-0.8, -0.8, 0.08]
workspace_max_m = [0.8, 0.8, 1.2]
# Replace these broad model bounds with the exported PolyScope safety setup.
ur_joint_min_rad = [-6.28, -6.28, -6.28, -6.28, -6.28, -6.28]
ur_joint_max_rad = [6.28, 6.28, 6.28, 6.28, 6.28, 6.28]
# Conservative policy rollout limits; legacy manual teleop is 0.107 m/s and 0.54 rad/s.
max_tcp_linear_m_s = 0.10
max_tcp_angular_rad_s = 0.30
max_wrist_step_rad = 0.05
# Audited firmware-source candidates only. Query GET_OUTPUT_CL on the active board.
wrist_min_rad = [-0.9424778, -0.4537856]
wrist_max_rad = [1.0995574, 0.7330383]
max_camera_skew_ms = 50.0

[cameras]
front_serial = "REPLACE_FRONT_D435_SERIAL"
side_serial = "REPLACE_SIDE_D435_SERIAL"
top_serial = "REPLACE_TOP_D435_SERIAL"
capture_fps = 30
width = 640
height = 480

[gripper]
backend = "hiwonder"
port = "/dev/serial/by-id/REPLACE_ME"
binary = true

[legacy]
root = "/home/user/shiyi/slai-manipulation"

[collection]
capture_fps = 30
record_hz = 10
max_camera_skew_ms = 50.0
raw_root = "data/raw/ur5_twinwrist"
